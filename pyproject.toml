[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherlab"
version = "1.0.0"
description = "AetherLab - Physics Desktop Workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AetherLab Team"}
]
keywords = ["physics", "manim", "llm", "desktop", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyQt6>=6.4.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.4.0",
    "PyMuPDF>=1.23.0",
]
numeric = [
    "scipy>=1.10.0",
]
narration = [
    # Voiceover: edge-tts synthesizes speech; imageio-ffmpeg ships a portable
    # ffmpeg binary so no system install is needed (and it bundles cleanly).
    "edge-tts>=6.1.0",
    "imageio-ffmpeg>=0.4.9",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
aetherlab = "aetherlab.__main__:main"

[project.urls]
Homepage = "https://github.com/aetherlab/aetherlab"
Repository = "https://github.com/aetherlab/aetherlab"

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.setuptools.package-data]
"*" = ["*.py"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
