[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physlab"
version = "1.0.0"
description = "PhysLab - multilingual physics and Kazakhstan ЕНТ preparation workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PhysLab Team"}
]
keywords = ["physics", "UNT", "ENT", "ҰБТ", "Manim", "desktop", "PyQt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyQt6>=6.4.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    # Validate downloaded cloud video without installing local Manim.
    "av>=16.0.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.4.0",
    "PyMuPDF>=1.23.0",
]
numeric = [
    "scipy>=1.10.0",
]
render = [
    "manim==0.21.0",
]
verification = [
    "sympy>=1.12",
    "pint>=0.24",
]
narration = [
    # Voiceover: edge-tts synthesizes speech; imageio-ffmpeg ships a portable
    # ffmpeg binary so no system install is needed (and it bundles cleanly).
    "edge-tts>=6.1.0",
    "imageio-ffmpeg>=0.4.9",
]
proctoring = [
    # Local face-presence sampling only; frames are processed in memory and discarded.
    "opencv-python-headless>=4.8",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
physlab = "aetherlab.__main__:main"
# Keep the original command name as a compatibility alias for existing users.
aetherlab = "aetherlab.__main__:main"
physlab-leaderboard-server = "aetherlab.services.leaderboard_server:main"

[project.urls]
Homepage = "https://github.com/aetherlab/aetherlab"
Repository = "https://github.com/aetherlab/aetherlab"

[tool.setuptools]
packages = { find = { where = ["."] } }

[tool.setuptools.package-data]
"*" = ["*.py"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
