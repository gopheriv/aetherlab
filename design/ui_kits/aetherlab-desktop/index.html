<!-- @dsCard group="AetherLab Desktop" viewport="1500x950" name="AetherLab Desktop App" subtitle="Full click-through — Empty, Running, Derivation, Visualization, Code, Library, Settings, History" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AetherLab — Desktop UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: #05050a; height: 100%; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #root { transform-origin: center center; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1500, window.innerHeight / 950);
    document.getElementById('root').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
<script type="text/babel" src="Rail.jsx"></script>
<script type="text/babel" src="TitleBar.jsx"></script>
<script type="text/babel" src="EmptyState.jsx"></script>
<script type="text/babel" src="RunningView.jsx"></script>
<script type="text/babel" src="DerivationView.jsx"></script>
<script type="text/babel" src="SceneView.jsx"></script>
<script type="text/babel" src="LibraryManager.jsx"></script>
<script type="text/babel" src="SettingsDialog.jsx"></script>
<script type="text/babel" src="HistoryView.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">
  // Wait a tick for all babel scripts above (loaded async via src) to register on window.
  function boot() {
    if (!window.App) { setTimeout(boot, 30); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
    fitStage();
  }
  boot();
</script>
</body>
</html>
