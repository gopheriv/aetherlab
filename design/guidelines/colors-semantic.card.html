<!-- @dsCard group="Colors" viewport="700x150" name="Semantic States" subtitle="Pending / active / complete / error pipeline states" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-ui);padding:16px;}
  .row{display:flex;gap:10px;}
  .chip{flex:1;height:96px;border-radius:var(--radius-md);border:1px solid var(--border-default);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .dot{width:14px;height:14px;border-radius:50%;}
  .chip span{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);}
</style>
<div class="row">
  <div class="chip"><div class="dot" style="background:var(--state-pending)"></div><span>pending</span></div>
  <div class="chip"><div class="dot" style="background:var(--state-active);box-shadow:var(--glow-cyan)"></div><span>active</span></div>
  <div class="chip"><div class="dot" style="background:var(--state-complete)"></div><span>complete</span></div>
  <div class="chip"><div class="dot" style="background:var(--state-error)"></div><span>error</span></div>
</div>
