<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals / Blueprint Dark" subtitle="Base backgrounds and hairline borders" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-ui);padding:16px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;}
  .sw span{font-size:11px;font-family:var(--font-mono);color:var(--text-primary);}
</style>
<div class="row">
  <div class="sw" style="background:var(--bg-deepest);border:1px solid var(--border-default)"><span>0A0A0F</span></div>
  <div class="sw" style="background:var(--bg-panel-1);border:1px solid var(--border-default)"><span>0D0D14</span></div>
  <div class="sw" style="background:var(--bg-panel-2);border:1px solid var(--border-default)"><span>13131A</span></div>
  <div class="sw" style="background:var(--bg-deepest);border:2px solid var(--border-hairline)"><span>border 1E293B</span></div>
  <div class="sw" style="background:var(--bg-deepest);border:2px solid var(--border-strong)"><span>border 334155</span></div>
</div>
