<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing In Use" subtitle="Card padding, gaps between controls" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-ui);padding:16px;box-sizing:border-box;}
  .card{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-4);display:flex;gap:var(--space-3);align-items:center;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-cyan);flex:none;}
  .card span{color:var(--text-secondary);font-size:13px;}
</style>
<div class="card">
  <div class="dot"></div>
  <span>padding: space-4 (16px) · gap: space-3 (12px) — the standard card rhythm</span>
</div>
