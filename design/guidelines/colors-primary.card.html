<!-- @dsCard group="Colors" viewport="700x150" name="Accent Colors" subtitle="Cyan primary, emerald/violet secondary, amber/rose semantic" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-ui);padding:16px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--border-default);}
  .sw span{font-size:11px;color:var(--text-primary);font-family:var(--font-mono);}
  .sw small{display:block;font-size:10px;color:rgba(255,255,255,0.6);}
</style>
<div class="row">
  <div class="sw" style="background:var(--accent-cyan)"><span>cyan</span><small>#06B6D4</small></div>
  <div class="sw" style="background:var(--accent-emerald)"><span>emerald</span><small>#10B981</small></div>
  <div class="sw" style="background:var(--accent-violet)"><span>violet</span><small>#8B5CF6</small></div>
  <div class="sw" style="background:var(--accent-amber)"><span>amber</span><small>#F59E0B</small></div>
  <div class="sw" style="background:var(--accent-rose)"><span>rose</span><small>#F43F5E</small></div>
</div>
