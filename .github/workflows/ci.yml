name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[rag]
          pip install manim matplotlib pillow

      - name: Run behavioural feature suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_features.py

      - name: Regenerate feature tracker
        run: python build_feature_tracker.py

      - name: Verify tracker artifact integrity
        run: python tools/tracker_integrity_audit.py --check

      - name: Verify feature surface coverage
        run: python tools/feature_surface_audit.py --check

      - name: Run focused pytest regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compile source tree
        run: python -m compileall -q aetherlab tests test_features.py build_feature_tracker.py tools

      - name: Check whitespace
        run: git diff --check

      - name: Ensure generated tracker artifacts are committed
        run: git diff --exit-code -- AetherLab_Feature_Tracker.xlsx AetherLab_Feature_Tracker.csv feature_test_results.json

      - name: Upload tracker + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-tracker
          path: |
            AetherLab_Feature_Tracker.xlsx
            AetherLab_Feature_Tracker.csv
            feature_test_results.json

      - name: Upload visual baseline summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baseline-summary
          path: |
            visual_regression/baseline/current/summary.json
            visual_regression/baseline/current/summary.md
            visual_regression/baseline/current/metrics.csv
            visual_regression/baseline/current/*_contact.jpg
